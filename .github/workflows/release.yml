# Builds cs2.dll on every push to main and publishes it as a GitHub release tagged v<VERSION>.
# The version comes from the VERSION file in the repo root. A push that does not change it builds nothing
# new: the tag already exists, so the run stops after the check. Bump VERSION to publish a new release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Same toolchain as the local build: Visual Studio 2022 17.14 with the ClangCL toolset (clang 19).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 0.1.0, got '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          git fetch --tags --quiet
          if (git tag --list "v$version") {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "v$version is already released. Bump VERSION to publish a new one."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up vcpkg
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          # vcpkg.json pins a builtin-baseline commit, so the runner's vcpkg clone needs its full history.
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --quiet origin
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - uses: microsoft/setup-msbuild@v2
        if: steps.version.outputs.exists == 'false'

      - name: Build
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          msbuild velocity-cs2.vcxproj /p:Configuration=Ship /p:Platform=x64 /p:OutDir=$env:GITHUB_WORKSPACE/out/ /m /nologo /v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path out/cs2.dll)) { throw "build finished but out/cs2.dll is missing" }

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the message of the commit that bumped the version.
          git log -1 --format=%B | Out-File notes.md -Encoding utf8
          gh release create "${{ steps.version.outputs.tag }}" out/cs2.dll --target $env:GITHUB_SHA --title "aimwhere ${{ steps.version.outputs.version }}" --notes-file notes.md
